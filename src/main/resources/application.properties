spring.application.name=wealthops

spring.datasource.url=jdbc:postgresql://localhost:5433/wealthops_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Dev-only secret — 256-bit, base64. Move this to an env var
# (JWT_SECRET) before this ever goes anywhere near production/GitHub.
jwt.secret=${JWT_SECRET}
# 24 hours, in ms
jwt.expiration=86400000